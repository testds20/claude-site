<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 95 790 530" width="790" height="530" role="img" aria-label="Claude and ChatGPT outputs staying on brand">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#101010" flood-opacity=".07"/>
    </filter>
    <linearGradient id="gClaude" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8895F"/><stop offset="1" stop-color="#C85F38"/>
    </linearGradient>
    <linearGradient id="gGpt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B3B3B"/><stop offset="1" stop-color="#0B0B0B"/>
    </linearGradient>
    <linearGradient id="gBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B4FE4"/><stop offset="1" stop-color="#101C7A"/>
    </linearGradient>
  </defs>

  <!-- dashed routing -->
  <g fill="none" stroke="#c9c9c9" stroke-width="2" stroke-dasharray="7 8" stroke-linecap="round">
    <path d="M190 300v96a22 22 0 0 0 22 22h62"/>
    <path d="M710 300v96a22 22 0 0 1-22 22h-62"/>
  </g>
  <g fill="#101010">
    <path d="M278 411l12 7-12 7z"/>
    <path d="M622 411l-12 7 12 7z"/>
  </g>

  <!-- Claude -->
  <rect x="90" y="120" width="200" height="180" rx="22" fill="#ffffff" stroke="#ececec" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="190" cy="186" r="34" fill="url(#gClaude)"/>
  <path d="M190.0 181.0L190.0 167.0" stroke="#fff" stroke-width="5.2" stroke-linecap="round"/><path d="M192.9 182.0L201.2 170.6" stroke="#fff" stroke-width="5.2" stroke-linecap="round"/><path d="M194.8 184.5L208.1 180.1" stroke="#fff" stroke-width="5.2" stroke-linecap="round"/><path d="M194.8 187.5L208.1 191.9" stroke="#fff" stroke-width="5.2" stroke-linecap="round"/><path d="M192.9 190.0L201.2 201.4" stroke="#fff" stroke-width="5.2" stroke-linecap="round"/><path d="M190.0 191.0L190.0 205.0" stroke="#fff" stroke-width="5.2" stroke-linecap="round"/><path d="M187.1 190.0L178.8 201.4" stroke="#fff" stroke-width="5.2" stroke-linecap="round"/><path d="M185.2 187.5L171.9 191.9" stroke="#fff" stroke-width="5.2" stroke-linecap="round"/><path d="M185.2 184.5L171.9 180.1" stroke="#fff" stroke-width="5.2" stroke-linecap="round"/><path d="M187.1 182.0L178.8 170.6" stroke="#fff" stroke-width="5.2" stroke-linecap="round"/>
  <text x="190" y="252" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="600" fill="#101010">Claude</text>
  <rect x="140" y="268" width="100" height="10" rx="5" fill="#ededed"/>

  <!-- ChatGPT -->
  <rect x="610" y="120" width="200" height="180" rx="22" fill="#ffffff" stroke="#ececec" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="710" cy="186" r="34" fill="url(#gGpt)"/>
  <g transform="translate(710 186) rotate(0)"><rect x="-5.0" y="-21.0" width="10.0" height="23.0" rx="5.0" fill="none" stroke="#fff" stroke-width="2.3"/></g><g transform="translate(710 186) rotate(60)"><rect x="-5.0" y="-21.0" width="10.0" height="23.0" rx="5.0" fill="none" stroke="#fff" stroke-width="2.3"/></g><g transform="translate(710 186) rotate(120)"><rect x="-5.0" y="-21.0" width="10.0" height="23.0" rx="5.0" fill="none" stroke="#fff" stroke-width="2.3"/></g><g transform="translate(710 186) rotate(180)"><rect x="-5.0" y="-21.0" width="10.0" height="23.0" rx="5.0" fill="none" stroke="#fff" stroke-width="2.3"/></g><g transform="translate(710 186) rotate(240)"><rect x="-5.0" y="-21.0" width="10.0" height="23.0" rx="5.0" fill="none" stroke="#fff" stroke-width="2.3"/></g><g transform="translate(710 186) rotate(300)"><rect x="-5.0" y="-21.0" width="10.0" height="23.0" rx="5.0" fill="none" stroke="#fff" stroke-width="2.3"/></g>
  <text x="710" y="252" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="600" fill="#101010">ChatGPT</text>
  <rect x="660" y="268" width="100" height="10" rx="5" fill="#ededed"/>

  <!-- on-brand output -->
  <rect x="300" y="330" width="300" height="250" rx="26" fill="#ffffff" stroke="#ececec" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="450" cy="398" r="36" fill="url(#gBrand)"/>
  <path d="M434 398l11 11 21-23" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="340" y="452" width="220" height="92" rx="16" fill="url(#gBrand)"/>
  <rect x="364" y="480" width="172" height="13" rx="6.5" fill="#ffffff" opacity=".92"/>
  <rect x="364" y="504" width="128" height="13" rx="6.5" fill="#ffffff" opacity=".6"/>
  <text x="450" y="604" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" letter-spacing="1.6" fill="#8C887E">ON BRAND</text>
</svg>